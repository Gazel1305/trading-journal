<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal (Cloud Sync)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: none; }
        .header-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 0; margin-bottom: 30px; }
        .status-win { color: #198754; font-weight: bold; }
        .status-loss { color: #dc3545; font-weight: bold; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999;
            display: none; justify-content: center; align-items: center; flex-direction: column;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <span id="loadingText">กำลังโหลดข้อมูล...</span>
    </div>

    <div class="header-bg text-center">
        <h1><i class="fas fa-cloud"></i> Trading Journal Online</h1>
        <p>บันทึกลง Google Sheets อัตโนมัติ</p>
    </div>

    <div class="container mb-5">
        
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <div class="alert alert-info d-flex align-items-center" role="alert">
                    <i class="fas fa-link me-2"></i>
                    <div class="flex-grow-1">
                        <input type="password" id="scriptUrl" class="form-control form-control-sm" placeholder="วาง URL จาก Google Apps Script ที่นี่ (https://script.google.com/...)" onchange="saveUrl()">
                    </div>
                    <button class="btn btn-sm btn-primary ms-2" onclick="loadDataFromCloud()">โหลดข้อมูล</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card p-4">
                    <h4 class="mb-3"><i class="fas fa-save"></i> บันทึกออเดอร์</h4>
                    <form id="tradeForm">
                        <div class="mb-3">
                            <label>วันที่</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Symbol</label>
                            <input type="text" id="symbol" class="form-control" placeholder="BTC/USDT" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label>Side</label>
                                <select id="side" class="form-select">
                                    <option value="LONG">🟢 LONG</option>
                                    <option value="SHORT">🔴 SHORT</option>
                                </select>
                            </div>
                            <div class="col">
                                <label>Status</label>
                                <select id="status" class="form-select">
                                    <option value="Win">✅ Win</option>
                                    <option value="Loss">❌ Loss</option>
                                    <option value="BE">➖ BE</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label>Entry</label>
                                <input type="number" step="any" id="entry" class="form-control" required>
                            </div>
                            <div class="col">
                                <label>Exit</label>
                                <input type="number" step="any" id="exit" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>Size (จำนวนของ)</label>
                            <input type="number" step="any" id="size" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Note</label>
                            <textarea id="note" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">บันทึกลง Google Sheets</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0"><i class="fas fa-list"></i> ประวัติการเทรด</h4>
                        <div class="text-end">
                             <span class="badge bg-secondary p-2">กำไรสุทธิ: <span id="totalPnL">$0.00</span></span>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Symbol</th>
                                    <th>Side</th>
                                    <th>Status</th>
                                    <th class="text-end">PnL ($)</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr><td colspan="5" class="text-center text-muted">กรุณาใส่ URL แล้วกดโหลดข้อมูล</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();
        
        // โหลด URL ที่เคยบันทึกไว้
        const savedUrl = localStorage.getItem('scriptUrl');
        if(savedUrl) {
            document.getElementById('scriptUrl').value = savedUrl;
            loadDataFromCloud();
        }

        function saveUrl() {
            localStorage.setItem('scriptUrl', document.getElementById('scriptUrl').value);
        }

        // ฟังก์ชันส่งข้อมูล (Save)
        document.getElementById('tradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const url = document.getElementById('scriptUrl').value;
            if(!url) return alert("กรุณาใส่ URL ของ Google Apps Script ก่อนครับ");

            const entry = parseFloat(document.getElementById('entry').value);
            const exit = parseFloat(document.getElementById('exit').value);
            const size = parseFloat(document.getElementById('size').value);
            const side = document.getElementById('side').value;
            
            // คำนวณ PnL
            let pnl = side === 'LONG' ? (exit - entry) * size : (entry - exit) * size;

            const data = {
                date: document.getElementById('date').value,
                symbol: document.getElementById('symbol').value.toUpperCase(),
                side: side,
                status: document.getElementById('status').value,
                entry: entry,
                exit: exit,
                size: size,
                pnl: pnl.toFixed(2),
                note: document.getElementById('note').value
            };

            showLoading(true, "กำลังบันทึกลง Cloud...");

            // ส่งข้อมูลแบบ Text Plain เพื่อเลี่ยง CORS Preflight
            fetch(url, {
                method: 'POST',
                body: JSON.stringify(data),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(response => response.text())
            .then(result => {
                alert("✅ บันทึกสำเร็จ!");
                document.getElementById('tradeForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                loadDataFromCloud(); // โหลดข้อมูลใหม่มาแสดง
            })
            .catch(error => {
                alert("❌ เกิดข้อผิดพลาด: " + error);
            })
            .finally(() => showLoading(false));
        });

        // ฟังก์ชันดึงข้อมูล (Load)
        function loadDataFromCloud() {
            const url = document.getElementById('scriptUrl').value;
            if(!url) return;

            showLoading(true, "กำลังดึงข้อมูลจาก Google Sheets...");

            fetch(url)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                let totalPnL = 0;

                // กลับลำดับข้อมูลให้ล่าสุดอยู่บน (Reverse)
                data.reverse().forEach(row => {
                    const tr = document.createElement('tr');
                    const pnlVal = parseFloat(row.PnL || row.pnl || 0);
                    totalPnL += pnlVal;
                    
                    const pnlClass = pnlVal >= 0 ? 'status-win' : 'status-loss';
                    const sideColor = row.Side === 'LONG' ? 'text-success' : 'text-danger';
                    
                    // เช็คว่าหัวข้อใน Sheet ตรงกับตัวแปรไหม (แก้ปัญหา Case Sensitive)
                    const date = row.Date || row.date;
                    const symbol = row.Symbol || row.symbol;
                    const side = row.Side || row.side;
                    const status = row.Status || row.status;

                    tr.innerHTML = `
                        <td>${date}</td>
                        <td class="fw-bold">${symbol}</td>
                        <td class="${sideColor}">${side}</td>
                        <td><span class="badge bg-light text-dark border">${status}</span></td>
                        <td class="text-end ${pnlClass}">${pnlVal >= 0 ? '+' : ''}${pnlVal.toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });

                const totalEl = document.getElementById('totalPnL');
                totalEl.innerText = '$' + totalPnL.toFixed(2);
                totalEl.className = totalPnL >= 0 ? 'status-win' : 'status-loss';
            })
            .catch(error => {
                console.error(error);
                // alert("ไม่สามารถดึงข้อมูลได้ (อาจยังไม่มีข้อมูลใน Sheet)");
            })
            .finally(() => showLoading(false));
        }

        function showLoading(show, text="กำลังโหลด...") {
            const el = document.getElementById('loading');
            document.getElementById('loadingText').innerText = text;
            el.style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
